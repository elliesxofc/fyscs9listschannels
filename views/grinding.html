<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pick which FYSC season to grind.">
  <title>Grinding | lilianax.lol</title>
  <link rel="icon" type="image/png" href="https://www.banner.yt/UC6SnTw5Tr3b6IoJhwNsQdvg/avatar" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --pink: #ff5fb0;
      --pink-soft: #ff9ecb;
      --pink-deep: #c239b3;
      --bg-0: #120311;
      --bg-1: #2b0a20;
      --bg-2: #4a0e33;
      --text: #ffe9f5;
      --text-dim: #d9a8c4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', 'Helvetica', sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, rgba(255, 95, 176, 0.18), transparent 45%),
                  radial-gradient(circle at 80% 75%, rgba(194, 57, 179, 0.22), transparent 50%),
                  linear-gradient(135deg, var(--bg-0), var(--bg-1), var(--bg-2), var(--bg-0));
      background-size: 200% 200%, 200% 200%, 400% 400%;
      animation: gradientShift 22s ease infinite;
      overflow-x: hidden;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 0%, 100% 100%, 0% 50%; }
      50% { background-position: 100% 100%, 0% 0%, 100% 50%; }
      100% { background-position: 0% 0%, 100% 100%, 0% 50%; }
    }

    .topbar {
      position: fixed;
      top: 24px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 28px;
      pointer-events: none;
    }

    .social-links {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .social-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 143, 214, 0.25);
      backdrop-filter: blur(8px);
      color: var(--pink-soft);
      font-size: 18px;
      text-decoration: none;
      transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease;
    }

    .social-links a:hover {
      transform: translateY(-3px);
      background: rgba(255, 95, 176, 0.18);
      color: #fff;
    }

    .back-link {
      position: fixed;
      top: 24px;
      left: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover { color: var(--pink-soft); }

    .card {
      width: min(480px, 90vw);
      padding: 56px 40px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 143, 214, 0.18);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.9s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: clamp(26px, 4vw, 34px);
      font-weight: 600;
      line-height: 1.35;
      margin: 0 0 8px;
    }

    h1 span {
      color: var(--pink);
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 32px;
      font-size: 14px;
      color: var(--text-dim);
      letter-spacing: 0.03em;
    }

    .button-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .fancy-button {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      padding: 15px 24px;
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      background: linear-gradient(90deg, var(--pink-deep), var(--pink));
      box-shadow: 0 8px 24px rgba(255, 95, 176, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .fancy-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 95, 176, 0.4);
      filter: brightness(1.08);
    }

    .fancy-button .sub {
      font-size: 12px;
      opacity: 0.8;
    }

    .button-season1 {
      background: linear-gradient(90deg, #7b1fa2, var(--pink-soft));
    }

    .button-season9 {
      background: linear-gradient(90deg, #ff7a18, var(--pink));
    }

    .fancy-button.is-closed {
      filter: grayscale(0.7);
      opacity: 0.6;
      box-shadow: none;
    }

    .fancy-button.is-closed:hover {
      filter: grayscale(0.7) brightness(1.08);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <a class="back-link" href="/"><i class="fa-solid fa-arrow-left"></i> Home</a>

  <div class="card">
    <h1>Which <span>FYSC</span> season are you selecting?</h1>
    <p class="subtitle">Pick a season to open its grinding page</p>
    <div class="button-list">
      <a href="https://grinding.tnstats.dev" class="fancy-button button-season1"><i class="fa-solid fa-fire"></i> Season 1 <span class="sub">(grinding.tnstats.dev)</span></a>
      <a href="https://fysc.lilianax.lol/grinding" class="fancy-button button-season9 is-closed"><i class="fa-solid fa-moon"></i> Season 9 <span class="sub">(closed)</span></a>
    </div>
  </div>
</body>
</html>
