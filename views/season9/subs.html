<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Live FYSC Season 9 subscriber count tracker.">
  <title>Live Subcount | lilianax.lol</title>
  <link rel="icon" type="image/png" href="https://www.banner.yt/UC6SnTw5Tr3b6IoJhwNsQdvg/avatar" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=DM+Sans:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --pink: #ff5fb0;
      --pink-soft: #ff9ecb;
      --pink-deep: #c239b3;
      --bg-0: #120311;
      --bg-1: #2b0a20;
      --bg-2: #4a0e33;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 143, 214, 0.18);
      --text: #ffe9f5;
      --text-dim: #d9a8c4;
      --up: #4ee08a;
      --down: #ff6b6b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Poppins', 'Helvetica', sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, rgba(255, 95, 176, 0.18), transparent 45%),
                  radial-gradient(circle at 80% 75%, rgba(194, 57, 179, 0.22), transparent 50%),
                  linear-gradient(135deg, var(--bg-0), var(--bg-1), var(--bg-2), var(--bg-0));
      background-size: 200% 200%, 200% 200%, 400% 400%;
      animation: gradientShift 22s ease infinite;
      padding: 90px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 0%, 100% 100%, 0% 50%; }
      50% { background-position: 100% 100%, 0% 0%, 100% 50%; }
      100% { background-position: 0% 0%, 100% 100%, 0% 50%; }
    }

    .back-link {
      position: fixed;
      top: 24px;
      left: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--pink-soft);
    }

    .loading {
      display: none;
      align-items: center;
      gap: 10px;
      color: var(--text-dim);
      font-size: 14px;
      margin-top: 40px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 143, 214, 0.25);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      color: var(--text-dim);
      font-size: 14px;
      margin-top: 40px;
      text-align: center;
    }

    .subcount-card {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
      padding: 32px 28px 28px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 32px;
      color: #fff;
      background: linear-gradient(135deg, var(--pink-deep), var(--pink-soft));
      overflow: hidden;
      border: 3px solid var(--card-border);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .channel-name {
      margin: 16px 0 0;
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      word-break: break-word;
    }

    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--up);
      margin-right: 6px;
      box-shadow: 0 0 0 0 rgba(78, 224, 138, 0.6);
      animation: pulse 1.8s ease-out infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(78, 224, 138, 0.55); }
      70% { box-shadow: 0 0 0 8px rgba(78, 224, 138, 0); }
      100% { box-shadow: 0 0 0 0 rgba(78, 224, 138, 0); }
    }

    /* Headline count. Rendered by RollingNumber (see script): one clipped
       "slot" per digit, with a ribbon of digits that slides up when it rolls. */
    .subscriber-count {
      --cell: 1.15em;              /* height of one digit slot */
      --fade: 14%;                 /* top/bottom edge fade while a digit rolls */
      --up-color: #04f997;         /* flash colour while the count goes up */
      --down-color: lightcoral;    /* flash colour while the count goes down */
      --roll-ms: 900ms;            /* set from JS to match the roll duration */
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin: 18px 0 2px;
      font-family: 'DM Sans', 'Helvetica', sans-serif;
      font-size: clamp(36px, 8vw, 52px);
      font-weight: 700;
      line-height: var(--cell);
      letter-spacing: -0.5px;
      color: var(--text);
      user-select: none;
    }

    .roll-col {
      display: block;
      width: 0.6em;                   /* JS sets this to the width of the digit currently shown */
      height: var(--cell);
      overflow: hidden;
    }

    .roll-ribbon {
      display: block;
      will-change: transform;
    }

    .roll-digit,
    .roll-sep {
      display: block;
      height: var(--cell);
      line-height: var(--cell);
      text-align: center;
    }

    .roll-sep {
      height: var(--cell);
    }

    /* Soft fade at the top/bottom of the slot, only while rolling, so settled
       digits stay perfectly crisp. */
    .roll-col.is-rolling {
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 var(--fade), #000 calc(100% - var(--fade)), transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, #000 var(--fade), #000 calc(100% - var(--fade)), transparent 100%);
    }

    /* Up/down colour flash on the WHOLE count (digits + commas together):
       white -> green (or red) -> white over one roll. */
    .subscriber-count.flash-up {
      animation: roll-flash-up var(--roll-ms) ease 1;
    }

    .subscriber-count.flash-down {
      animation: roll-flash-down var(--roll-ms) ease 1;
    }

    @keyframes roll-flash-up {
      0%   { color: var(--text); }
      50%  { color: var(--up-color); }
      100% { color: var(--text); }
    }

    @keyframes roll-flash-down {
      0%   { color: var(--text); }
      50%  { color: var(--down-color); }
      100% { color: var(--text); }
    }

    .subscriber-label {
      margin: 0 0 26px;
      font-size: 13px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--card-border);
      margin-bottom: 22px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: 100%;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stat-value.up {
      color: var(--up);
    }

    .stat-value.down {
      color: var(--down);
    }

    .updated-at {
      margin-top: 22px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .joined-date {
      margin: 0 0 22px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .joined-date strong {
      color: var(--text);
      font-weight: 600;
    }

    @media (max-width: 420px) {
      .stats-row {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <a class="back-link" href="/season9/fyscchannels"><i class="fa-solid fa-arrow-left"></i> Channels</a>

  <div class="loading" id="loading"><span class="spinner"></span> Loading live subcount...</div>
  <p class="empty-state" id="emptyState" style="display: none;"></p>

  <div class="subcount-card" id="subcountCard">
    <div class="avatar" id="avatar"></div>
    <p class="channel-name" id="channelName"></p>
    <p class="subscriber-count" id="subscriberCount" role="status" aria-live="off">0</p>
    <p class="subscriber-label"><span class="live-dot"></span>Subscribers</p>
    <p class="joined-date" id="joinedDate"></p>

    <div class="divider"></div>

    <div class="stats-row">
      <div class="stat">
        <span class="stat-label">Last Minute</span>
        <span class="stat-value" id="lastMinute">+0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Last Hour</span>
        <span class="stat-value" id="lastHour">+0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Growth / Day</span>
        <span class="stat-value" id="dailyGrowth">+0</span>
      </div>
    </div>

    <p class="updated-at" id="updatedAt"></p>
  </div>

  <script src="/config.js"></script>
  <script>
    // Fetched straight from fysca's public, keyless endpoint (see config.js).
    const DATA_ENDPOINT = window.FYSC_API_BASE + '/public/s9_data';
    const POLL_INTERVAL_MS = 4000;
    // Rate is estimated from samples taken within this trailing window, so it
    // reacts to recent movement instead of averaging over the whole session.
    const RATE_WINDOW_MS = 2 * 60 * 1000;

    const params = new URLSearchParams(location.search);
    const targetCid = params.get('fyscChannel');

    const loading = document.getElementById('loading');
    const emptyState = document.getElementById('emptyState');
    const card = document.getElementById('subcountCard');
    const avatarEl = document.getElementById('avatar');
    const nameEl = document.getElementById('channelName');
    const joinedDateEl = document.getElementById('joinedDate');
    const countEl = document.getElementById('subscriberCount');
    const lastMinuteEl = document.getElementById('lastMinute');
    const lastHourEl = document.getElementById('lastHour');
    const dailyGrowthEl = document.getElementById('dailyGrowth');
    const updatedAtEl = document.getElementById('updatedAt');

    // {t: ms timestamp, count: subscriber count} samples, oldest first.
    let history = [];
    let rateOfChangePerMs = 0;
    let counter = null;          // RollingNumber instance, created on first data

    // Startup animation: the count first shows 0, holds for a beat, then every
    // digit rolls up to the real number (like the reference overlay).
    const INTRO_DELAY_MS = 350;
    const ROLL_DURATION_MS = 900;
    let counterReady = false;    // true once the intro roll has been kicked off
    let latestCount = 0;         // newest value seen, so the intro never rolls to a stale number

    function formatNumber(num) {
      return Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function formatSigned(num) {
      const rounded = Math.round(num);
      const sign = rounded > 0 ? '+' : rounded < 0 ? '−' : '+';
      return `${sign}${formatNumber(Math.abs(rounded))}`;
    }

    function setSignedStat(el, value) {
      el.textContent = formatSigned(value);
      el.classList.remove('up', 'down');
      el.classList.add(value < 0 ? 'down' : 'up');
    }

    function formatJoinedDate(value) {
      if (!value) return 'Joined FYSC: <strong>unknown</strong>';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return 'Joined FYSC: <strong>unknown</strong>';
      const formatted = date.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
      return `Joined FYSC: <strong>${formatted}</strong>`;
    }

    function initials(name) {
      return name.split(' ').filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase();
    }

    function showError(message) {
      loading.style.display = 'none';
      card.style.display = 'none';
      emptyState.textContent = message;
      emptyState.style.display = 'block';
    }

    // ---------------------------------------------------------------------
    // RollingNumber: a small self-contained odometer (no libraries).
    //   * One clipped slot per digit, columns are counted from the right.
    //   * set(n) slides every digit that changes up (or down if n decreased)
    //     through the digits in between, using the Web Animations API.
    //   * New leading digits start from 0, so the very first set() after
    //     showing "0" rolls the whole number up from zero.
    // ---------------------------------------------------------------------
    class RollingNumber {
      constructor(el, { duration = 900, easing = 'cubic-bezier(0.22, 0.61, 0.36, 1)', maxSpin = 30 } = {}) {
        this.el = el;
        this.duration = duration;
        this.easing = easing;
        this.maxSpin = maxSpin;   // most digits one column will spin through
        this.cols = [];           // cols[place]: 0 = ones, 1 = tens, ...
        this.nDigits = 0;
        this.value = 0;
        el.style.setProperty('--roll-ms', duration + 'ms');
        this.set(0, false);
      }

      // Width of each digit 0-9 in em, measured from the real font (see
      // syncDigitWidths). Each column is as wide as the digit it shows, so the
      // number looks like normal text instead of fixed-width cells.
      static widthOf(d) {
        return RollingNumber.widths[d] + 'em';
      }

      refreshWidths() {
        this.cols.forEach(col => { if (!col.anim) col.root.style.width = RollingNumber.widthOf(col.digit); });
      }

      // Colour flash on the whole odometer, restarted on every update.
      _flash(dir) {
        const el = this.el;
        el.classList.remove('flash-up', 'flash-down');
        void el.offsetWidth;                     // restart the CSS animation
        el.classList.add(dir > 0 ? 'flash-up' : 'flash-down');
        clearTimeout(this.flashTimer);
        this.flashTimer = setTimeout(() => el.classList.remove('flash-up', 'flash-down'), this.duration + 50);
      }

      static digitEl(d) {
        const span = document.createElement('span');
        span.className = 'roll-digit';
        span.textContent = d;
        return span;
      }

      _ensureCol(place) {
        if (this.cols[place]) return this.cols[place];
        const root = document.createElement('span');
        root.className = 'roll-col';
        const ribbon = document.createElement('span');
        ribbon.className = 'roll-ribbon';
        ribbon.appendChild(RollingNumber.digitEl(0));
        root.appendChild(ribbon);
        root.style.width = RollingNumber.widthOf(0);
        return (this.cols[place] = { root, ribbon, digit: 0, target: 0, anim: null, wAnim: null, timer: null });
      }

      // Rebuild the child order (digits + thousands separators) left -> right.
      _layout() {
        const frag = document.createDocumentFragment();
        for (let p = this.nDigits - 1; p >= 0; p--) {
          frag.appendChild(this.cols[p].root);
          if (p > 0 && p % 3 === 0) {
            const sep = document.createElement('span');
            sep.className = 'roll-sep';
            sep.textContent = ',';
            frag.appendChild(sep);
          }
        }
        this.el.replaceChildren(frag);
      }

      _commit(col) {
        if (!col.anim) return;
        clearTimeout(col.timer);
        col.anim.onfinish = null;
        col.anim.cancel();
        col.anim = null;
        if (col.wAnim) { col.wAnim.cancel(); col.wAnim = null; }
        col.digit = col.target;
        col.ribbon.replaceChildren(RollingNumber.digitEl(col.digit));
        col.root.style.width = RollingNumber.widthOf(col.digit);
        col.root.classList.remove('is-rolling');
      }

      _roll(col, target, ticks) {
        this._commit(col);                       // finish any roll still in flight
        const from = col.digit;
        if (from === target && ticks === 0) return;

        const dir = ticks >= 0 ? 1 : -1;
        const need = dir > 0 ? (target - from + 10) % 10 : (from - target + 10) % 10;
        let steps = Math.abs(ticks);
        if (steps > this.maxSpin) steps = need + 10 * Math.floor((this.maxSpin - need) / 10);
        if (steps % 10 !== need) steps = need;   // safety: always land on the target digit
        if (steps === 0) return;

        // Ribbon, top -> bottom. Up: from ... target. Down: target ... from.
        const els = [];
        for (let i = 0; i <= steps; i++) {
          const d = dir > 0 ? (from + i) % 10 : (target + i) % 10;
          els.push(RollingNumber.digitEl(d));
        }
        col.ribbon.replaceChildren(...els);
        col.target = target;

        const frac = (steps / (steps + 1)) * 100;
        const frames = dir > 0
          ? [{ transform: 'translateY(0)' }, { transform: `translateY(-${frac}%)` }]
          : [{ transform: `translateY(-${frac}%)` }, { transform: 'translateY(0)' }];

        col.root.classList.add('is-rolling');
        col.anim = col.ribbon.animate(frames, { duration: this.duration, easing: this.easing, fill: 'both' });
        col.anim.onfinish = () => this._commit(col);
        // The column's width glides from the old digit's width to the new one's.
        col.wAnim = col.root.animate(
          [{ width: RollingNumber.widthOf(from) }, { width: RollingNumber.widthOf(target) }],
          { duration: this.duration, easing: this.easing, fill: 'both' }
        );
        // Safety net: even if animation events never fire (throttled/hidden
        // tab), the digit is guaranteed to end on the right value.
        col.timer = setTimeout(() => this._commit(col), this.duration + 400);
      }

      set(value, animate = true) {
        value = Math.max(0, Math.round(Number(value) || 0));
        const old = this.value;
        if (animate && value === old) return;

        const nDigits = String(value).length;
        for (let p = 0; p < nDigits; p++) this._ensureCol(p);
        for (let p = nDigits; p < this.cols.length; p++) this._commit(this.cols[p]);
        this.cols.length = nDigits;
        if (nDigits !== this.nDigits || !this.el.firstChild) {
          this.nDigits = nDigits;
          this._layout();
        }
        this.el.setAttribute('aria-label', formatNumber(value));

        for (let p = 0; p < nDigits; p++) {
          const unit = Math.pow(10, p);
          const target = Math.floor(value / unit) % 10;
          const ticks = Math.floor(value / unit) - Math.floor(old / unit);
          const col = this.cols[p];
          if (!animate) {
            this._commit(col);
            col.digit = target;
            col.ribbon.replaceChildren(RollingNumber.digitEl(target));
            col.root.style.width = RollingNumber.widthOf(target);
          } else {
            this._roll(col, target, ticks);
          }
        }
        if (animate) this._flash(value > old ? 1 : -1);
        this.value = value;
      }
    }

    RollingNumber.widths = Array(10).fill(0.6);   // replaced by real measurements once the font is ready

    // Measures every digit 0-9 in the count's current font and hands the widths
    // (in em) to RollingNumber. Runs once the font is ready.
    function syncDigitWidths(el) {
      const cs = getComputedStyle(el);
      const probe = document.createElement('span');
      probe.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:pre;';
      probe.style.fontFamily = cs.fontFamily;
      probe.style.fontSize = cs.fontSize;
      probe.style.fontWeight = cs.fontWeight;
      probe.style.letterSpacing = cs.letterSpacing;
      document.body.appendChild(probe);
      const size = parseFloat(cs.fontSize) || 1;
      const widths = [];
      for (let d = 0; d < 10; d++) {
        probe.textContent = d;
        widths.push(probe.getBoundingClientRect().width / size);
      }
      probe.remove();
      if (widths.every(w => w > 0)) RollingNumber.widths = widths;
    }

    // Resolves once DM Sans is loaded, or after maxMs, whichever comes first,
    // so a slow/blocked font can never hold the intro back.
    function fontReady(maxMs = 1500) {
      const load = (document.fonts && document.fonts.load)
        ? document.fonts.load('700 1em "DM Sans"', '0123456789,').catch(() => {})
        : Promise.resolve();
      return Promise.race([load, new Promise(resolve => setTimeout(resolve, maxMs))]);
    }

    // Headline count: shows 0 first, then rolls up to the real value; later
    // updates just roll from the previous value.
    function updateSubscriberCount(value) {
      latestCount = value;

      if (!counter) {
        counter = new RollingNumber(countEl, { duration: ROLL_DURATION_MS });
        countEl.style.opacity = '0';   // avoid a fallback-font flash before DM Sans is ready
        fontReady().then(() => {
          syncDigitWidths(countEl);
          counter.refreshWidths();
          countEl.style.opacity = '';
          setTimeout(() => {
            counterReady = true;
            counter.set(latestCount);
          }, INTRO_DELAY_MS);
        });
        return;
      }

      // Until the intro roll has started, just remember the newest value;
      // the timer above will roll straight to it.
      if (counterReady) counter.set(value);
    }

    function computeRate() {
      const now = Date.now();
      const windowed = history.filter(s => now - s.t <= RATE_WINDOW_MS);
      const sample = windowed.length >= 2 ? windowed : history;
      if (sample.length < 2) return 0;
      const first = sample[0];
      const last = sample[sample.length - 1];
      const dt = last.t - first.t;
      if (dt <= 0) return 0;
      return (last.count - first.count) / dt;
    }

    function renderStats() {
      setSignedStat(lastMinuteEl, rateOfChangePerMs * 60 * 1000);
      setSignedStat(lastHourEl, rateOfChangePerMs * 60 * 60 * 1000);
      setSignedStat(dailyGrowthEl, rateOfChangePerMs * 24 * 60 * 60 * 1000);
    }

    async function poll() {
      try {
        const response = await fetch(DATA_ENDPOINT);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error('Unexpected response shape');

        const channel = data.find(c => c.cid === targetCid);
        if (!channel) {
          showError('Channel not found in the current live data.');
          return;
        }

        if (loading.style.display !== 'none') {
          loading.style.display = 'none';
          card.style.display = 'flex';

          nameEl.textContent = channel.cname;
          joinedDateEl.innerHTML = formatJoinedDate(channel.joinedFysc);
          if (channel.cimage) {
            const img = document.createElement('img');
            img.src = channel.cimage;
            img.alt = channel.cname;
            img.onerror = () => { avatarEl.textContent = initials(channel.cname); };
            avatarEl.appendChild(img);
          } else {
            avatarEl.textContent = initials(channel.cname);
          }
        }

        updateSubscriberCount(channel.subscriberCountRealAPI);

        const now = Date.now();
        history.push({ t: now, count: channel.subscriberCountRealAPI });
        history = history.filter(s => now - s.t <= 65 * 60 * 1000);

        rateOfChangePerMs = computeRate();
        renderStats();
        updatedAtEl.textContent = `Last updated ${new Date(now).toLocaleTimeString()}`;
      } catch (err) {
        console.error('Error fetching live subcount:', err);
        if (loading.style.display !== 'none' && card.style.display !== 'flex') {
          showError('Failed to load live subcount. Is the API running?');
        }
      }
    }

    if (!targetCid) {
      showError('No channel specified.');
    } else {
      loading.style.display = 'flex';
      poll();
      setInterval(poll, POLL_INTERVAL_MS);
    }
  </script>
