<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socials | lilianax.lol</title>
  <link rel="icon" type="image/png" href="https://www.banner.yt/UC6SnTw5Tr3b6IoJhwNsQdvg/avatar" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --pink: #ff5fb0;
      --pink-soft: #ff9ecb;
      --pink-deep: #c239b3;
      --bg-0: #120311;
      --bg-1: #2b0a20;
      --bg-2: #4a0e33;
      --text: #ffe9f5;
      --text-dim: #d9a8c4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', 'Helvetica', sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, rgba(255, 95, 176, 0.18), transparent 45%),
                  radial-gradient(circle at 80% 75%, rgba(194, 57, 179, 0.22), transparent 50%),
                  linear-gradient(135deg, var(--bg-0), var(--bg-1), var(--bg-2), var(--bg-0));
      background-size: 200% 200%, 200% 200%, 400% 400%;
      animation: gradientShift 22s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 0%, 100% 100%, 0% 50%; }
      50% { background-position: 100% 100%, 0% 0%, 100% 50%; }
      100% { background-position: 0% 0%, 100% 100%, 0% 50%; }
    }

    .back-link {
      position: fixed;
      top: 24px;
      left: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover { color: var(--pink-soft); }

    .card {
      width: min(480px, 90vw);
      padding: 48px 40px 36px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 143, 214, 0.18);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    h1 {
      font-size: clamp(24px, 4vw, 30px);
      font-weight: 600;
      margin: 0 0 6px;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 13px;
      margin: 0 0 28px;
    }

    i.fa-heart { color: var(--pink); font-size: 32px; margin-bottom: 16px; }

    .link-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 143, 214, 0.12);
      text-decoration: none;
      text-align: left;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .link-row:hover {
      transform: translateY(-2px);
      border-color: var(--pink-soft);
      background: rgba(255, 95, 176, 0.08);
    }

    .link-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
    }

    .link-icon.website { background: linear-gradient(135deg, var(--pink-deep), var(--pink-soft)); }
    .link-icon.discord { background: #5865F2; }
    .link-icon.spotify { background: #1DB954; }
    .link-icon.youtube { background: #FF0000; }

    .link-text .label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .link-text .url {
      font-size: 12px;
      color: var(--pink-soft);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <a class="back-link" href="/"><i class="fa-solid fa-arrow-left"></i> Home</a>
  <div class="card">
    <i class="fa-solid fa-heart"></i>
    <h1>Socials</h1>
    <p class="subtitle">These are my social links :)</p>

    <div class="link-list">
      <a class="link-row" href="https://lilianax.lol" target="_blank" rel="noopener">
        <span class="link-icon website"><i class="fa-solid fa-globe"></i></span>
        <span class="link-text">
          <div class="label">Website</div>
          <div class="url">lilianax.lol</div>
        </span>
      </a>

      <a class="link-row" href="https://discord.gg/PnfrXwdwkU" target="_blank" rel="noopener">
        <span class="link-icon discord"><i class="fa-brands fa-discord"></i></span>
        <span class="link-text">
          <div class="label">Discord Server!</div>
          <div class="url">discord.gg/PnfrXwdwkU</div>
        </span>
      </a>

      <a class="link-row" href="https://open.spotify.com/artist/3teqoI0UAVVcg7nnvpEY5A" target="_blank" rel="noopener">
        <span class="link-icon spotify"><i class="fa-brands fa-spotify"></i></span>
        <span class="link-text">
          <div class="label">Spotify</div>
          <div class="url">open.spotify.com/artist/3teqoI0UAVVcg7nnvpEY5A</div>
        </span>
      </a>

      <a class="link-row" href="https://www.youtube.com/@elliesxofc" target="_blank" rel="noopener">
        <span class="link-icon youtube"><i class="fa-brands fa-youtube"></i></span>
        <span class="link-text">
          <div class="label">YouTube</div>
          <div class="url">youtube.com/@elliesxofc</div>
        </span>
      </a>
    </div>
  </div>
</body>
</html>
