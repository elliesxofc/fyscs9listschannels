<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="lilianax.lol — FYSC channel stats, socials, and status.">
  <title>lilianax.lol</title>
  <link rel="icon" type="image/png" href="https://www.banner.yt/UC6SnTw5Tr3b6IoJhwNsQdvg/avatar" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --pink: #ff5fb0;
      --pink-soft: #ff9ecb;
      --pink-deep: #c239b3;
      --bg-0: #120311;
      --bg-1: #2b0a20;
      --bg-2: #4a0e33;
      --text: #ffe9f5;
      --text-dim: #d9a8c4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', 'Helvetica', sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, rgba(255, 95, 176, 0.18), transparent 45%),
                  radial-gradient(circle at 80% 75%, rgba(194, 57, 179, 0.22), transparent 50%),
                  linear-gradient(135deg, var(--bg-0), var(--bg-1), var(--bg-2), var(--bg-0));
      background-size: 200% 200%, 200% 200%, 400% 400%;
      animation: gradientShift 22s ease infinite;
      overflow-x: hidden;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 0%, 100% 100%, 0% 50%; }
      50% { background-position: 100% 100%, 0% 0%, 100% 50%; }
      100% { background-position: 0% 0%, 100% 100%, 0% 50%; }
    }

    .topbar {
      position: fixed;
      top: 24px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 28px;
      pointer-events: none;
    }

    .social-links {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .social-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 143, 214, 0.25);
      backdrop-filter: blur(8px);
      color: var(--pink-soft);
      font-size: 18px;
      text-decoration: none;
      transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease;
    }

    .social-links a:hover {
      transform: translateY(-3px);
      background: rgba(255, 95, 176, 0.18);
      color: #fff;
    }

    .card {
      width: min(560px, 90vw);
      padding: 56px 40px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 143, 214, 0.18);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.9s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: clamp(26px, 4vw, 34px);
      font-weight: 600;
      line-height: 1.35;
      margin: 0 0 8px;
    }

    h1 span {
      color: var(--pink);
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 32px;
      font-size: 14px;
      color: var(--text-dim);
      letter-spacing: 0.03em;
    }

    .button-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .fancy-button {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      padding: 15px 24px;
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      background: linear-gradient(90deg, var(--pink-deep), var(--pink));
      box-shadow: 0 8px 24px rgba(255, 95, 176, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .fancy-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 95, 176, 0.4);
      filter: brightness(1.08);
    }

    .button-socials {
      background: linear-gradient(90deg, #7b1fa2, var(--pink-soft));
    }

    .button-status {
      background: linear-gradient(90deg, #d6006f, var(--pink-soft));
    }

    .card {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .card.switching {
      opacity: 0;
      transform: translateY(8px);
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .back-button:hover {
      color: var(--pink-soft);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div></div>
    <div class="social-links">
      <a href="/socials" target="_blank" aria-label="Discord"><i class="fab fa-discord"></i></a>
      <a href="/socials" target="_blank" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
    </div>
  </div>

  <div class="card" id="card">
    <div class="view active" id="view-home">
      <h1>Welcome to <span>lilianax.lol</span>, the official website</h1>
      <p class="subtitle">FYSC channel stats, socials &amp; live status</p>
      <div class="button-list">
        <a href="#" class="fancy-button button-channels" id="channelsButton"><i class="fa-solid fa-list"></i> FYSC Channels</a>
        <a href="/socials" class="fancy-button button-socials"><i class="fa-solid fa-heart"></i> Socials</a>
        <a href="/status" class="fancy-button button-status"><i class="fa-solid fa-circle-check"></i> Status</a>
      </div>
    </div>

    <div class="view" id="view-select">
      <h1>Which season are you selecting?</h1>
      <div class="button-list">
        <a href="/season9/fyscchannels" class="fancy-button"><i class="fa-solid fa-list"></i> Season 9</a>
      </div>
      <button class="back-button" id="backButton"><i class="fa-solid fa-arrow-left"></i> Back</button>
    </div>
  </div>

  <script>
    const card = document.getElementById('card');
    const viewHome = document.getElementById('view-home');
    const viewSelect = document.getElementById('view-select');

    function setView(showEl, hideEl) {
      hideEl.classList.remove('active');
      showEl.classList.add('active');
    }

    function switchView(showEl, hideEl, path) {
      history.pushState({}, '', path);
      card.classList.add('switching');
      setTimeout(() => {
        setView(showEl, hideEl);
        card.classList.remove('switching');
      }, 200);
    }

    document.getElementById('channelsButton').addEventListener('click', (e) => {
      e.preventDefault();
      switchView(viewSelect, viewHome, '/select');
    });

    document.getElementById('backButton').addEventListener('click', (e) => {
      e.preventDefault();
      switchView(viewHome, viewSelect, '/');
    });

    window.addEventListener('popstate', () => {
      if (location.pathname === '/select') {
        setView(viewSelect, viewHome);
      } else {
        setView(viewHome, viewSelect);
      }
    });

    if (location.pathname === '/select') {
      setView(viewSelect, viewHome);
    }
  </script>
</body>
</html>
